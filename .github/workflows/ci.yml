name: CI

on:
  push:
    branches: [main, staging, dev, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22.18.0"
          - os: ubuntu-24.04
            node: "24.21.0"
          - os: macos-15
            node: "24.21.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: "2.9.6"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:check
      - run: npm run jsr:check
      - name: Install the supported Bun runtime
        if: matrix.os == 'macos-15'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Test the built package on Bun
        if: matrix.os == 'macos-15'
        run: bun --no-env-file test test/*.test.ts
      - name: Switch to the minimum supported runtime
        if: matrix.node == '22.18.0'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"
          package-manager-cache: false
      - name: Test the built package on Node 22.0
        if: matrix.node == '22.18.0'
        run: node --import tsx --test test/*.test.ts
